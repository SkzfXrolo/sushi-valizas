<!doctype html>
<html lang="es" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fotos de Sushi Valizas: platos, ambiente y sushi de autor." />
    <title>Fotos | Sushi Valizas</title>
    <link rel="icon" href="/assets/brand/sushi-valizas.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-page="fotos" class="page-inner">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container reveal">
          <p class="eyebrow" data-i18n="gallery.eyebrow">Galería</p>
          <h1 data-i18n="gallery.title">Así se come en Sushi Valizas</h1>
          <p class="page-hero-lead" data-i18n="gallery.lead">
            Platos reales, presentaciones de autor y mesas bajo las luces de Valizas.
          </p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="carousel reveal" data-carousel style="margin-bottom: 1.5rem">
            <button type="button" class="carousel-nav carousel-nav--prev" data-carousel-prev aria-label="Anterior">‹</button>
            <div class="carousel-viewport">
              <div class="carousel-track" data-carousel-track></div>
            </div>
            <button type="button" class="carousel-nav carousel-nav--next" data-carousel-next aria-label="Siguiente">›</button>
            <div class="carousel-dots" data-carousel-dots></div>
          </div>
          <div class="gallery-grid reveal-stagger">
            <figure class="gallery-item gallery-item--wide"><img src="/assets/gallery/plato-01.webp" alt="Sushi de autor" loading="lazy" /></figure>
            <figure class="gallery-item"><img src="/assets/gallery/ambiente-01.webp" alt="Mesa en Valizas" loading="lazy" /></figure>
            <figure class="gallery-item"><img src="/assets/gallery/plato-02.webp" alt="Rolls" loading="lazy" /></figure>
            <figure class="gallery-item"><img src="/assets/gallery/plato-03.webp" alt="Presentación" loading="lazy" /></figure>
            <figure class="gallery-item"><img src="/assets/gallery/plato-04.webp" alt="Plato" loading="lazy" /></figure>
            <figure class="gallery-item"><img src="/assets/promo/hot-roll.webp" alt="Hot roll" loading="lazy" /></figure>
          </div>
          <p class="note reveal" style="margin-top: 1.5rem" data-i18n="gallery.note">Más fotos y novedades todos los días en Instagram @sushivalizas.</p>
          <div class="section-cta reveal">
            <a class="btn btn-primary" data-cta="ig" data-i18n="gallery.cta" href="#">Seguir en Instagram</a>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer" class="site-footer"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
