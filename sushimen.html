<!doctype html>
<html lang="es" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rubén Fernández, sushimen de Sushi Valizas." />
    <title>Sushimen | Sushi Valizas</title>
    <link rel="icon" href="/assets/brand/sushi-valizas.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-page="sushimen" class="page-inner">
    <div id="site-header"></div>
    <main>
      <section class="page-hero page-hero--photo" style="--hero-img: url('/assets/team/ruben.webp'); --hero-pos: center 20%">
        <div class="container reveal">
          <p class="eyebrow" data-i18n="chef.eyebrow">Sushimen</p>
          <h1 data-i18n="chef.title">Quién está detrás del sushi</h1>
          <p class="page-hero-lead" data-i18n="chef.lead">
            Cocina de autor: Rubén Fernández al frente del corte y las presentaciones.
          </p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="team-grid reveal-stagger">
            <article class="person person--photo">
              <img class="person-photo" src="/assets/team/ruben.webp" alt="Rubén Fernández" width="320" height="400" loading="lazy" />
              <div>
                <span class="role" data-i18n="chef.role">Sushimen</span>
                <h2 data-i18n="chef.name">Rubén Fernández</h2>
                <p data-i18n="chef.bio">Graduado de Gato Dumas, con especialización en La Obreria.</p>
                <p data-i18n="chef.extra">Su propuesta mezcla técnica con sabor local.</p>
                <ul class="meta-list">
                  <li data-i18n="chef.school">Gato Dumas</li>
                  <li data-i18n="chef.specialty">Especialización · La Obreria</li>
                </ul>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer" class="site-footer"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
